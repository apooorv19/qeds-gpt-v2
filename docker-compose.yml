services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: qeds-gpt-api:latest
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LOGFIRE_API_KEY=${LOGFIRE_API_KEY}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
      - LOGFIRE_ENABLED=${LOGFIRE_ENABLED:-true}
      - LOGFIRE_SEND_TO_LOGFIRE=${LOGFIRE_SEND_TO_LOGFIRE:-if-token-present}
      - APP_ENV=${APP_ENV:-local}
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: qeds-gpt-worker:latest
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - EMBEDDING_BACKEND=remote
      - LOGFIRE_API_KEY=${LOGFIRE_API_KEY}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
      - LOGFIRE_ENABLED=${LOGFIRE_ENABLED:-true}
      - LOGFIRE_SEND_TO_LOGFIRE=${LOGFIRE_SEND_TO_LOGFIRE:-if-token-present}
      - APP_ENV=${APP_ENV:-local}
    depends_on:
      redis:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: qeds-gpt-streamlit:latest
    ports:
      - "8501:8501"
    environment:
      - QEDS_API_URL=http://api:8000/api/v1
    depends_on:
      - api
